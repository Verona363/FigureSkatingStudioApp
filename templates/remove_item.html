{% extends "layout.html" %}

{% block title %}Delete training session{% endblock %}

{% block content %}
    <h2>Delete training session</h2>
    <p>Announcement: <a href="/item/{{ item.id }}"> {{item.title}}</a></p>
    <p>Are you sure you want to delete this training?</p>
  <form action="/remove_item/{{ item.id }}" method="post"> 
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" name="remove" value="Delete announcement">
    <input type="submit" name="back" value="Go back">
    </form>
    <!--When the form is submitted, send data to /remove_item/-->
    <!--Use method POST, buttons must be inside the tag form, to get sent to the server-->
{% endblock %}
