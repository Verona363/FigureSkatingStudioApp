<!DOCTYPE html>
<html>

<head>
  <title>New training session</title>
</head>

<body>
    <h1>Add a new training session</h1>
  <form action="/create_item" method="post">
    <p>
      Title: <br />  
      <input type="text" name="title" maxlength="80" required/>
    </p>
    <p>
      Training type: <br />
      <select name="training_type" required>
        <option value="">(choose)</option>
        <option value="off-ice">off-ice</option>
        <option value="on-ice">on-ice</option>
      </select>
    </p>
    <p>
      Specialization: <br />
      <select name="specialization">
        <option value="">(optional)</option>
        <option value="jumps">jumps</option>
        <option value="spins">spins</option>
        <option value="gliding">gliding</option>
        <option value="multi-modal training">multi-modal training</option>

        <option value="SFP">SFP (special physical training)</option>
        <option value="GFP">GFP (general physical training)</option>
        <option value="stretching">stretching</option>
        <option value="choregraphy">choreography</option>
        </select>
    </p>
    <p>
      Format (group/individual): <br /> 
      <select name="format" required>
        <option value="group">group</option>
        <option value="individual">individual</option>
        <option value="split">split</option>
      </select>
    </p>
    <p>
      Level: <br />
      <select name="training_level" required>
        <option value="all levels">all levels</option>
        <option value="beginner">beginner</option>
        <option value="intermediate">intermediate</option>
        <option value="advanced">advanced</option>
      </select>
    </p>
    <p>
      Coach: <br />
      <select name="coach_id">
        {% for coach in coaches %}
        <option value="{{ coach.id}}">{{ coach.username}} </option>
        {% endfor %}
      </select>
    </p>
    <p>
      Date: <br />
      <input type="date" name="training_date" required />
    </p>
    <p>
      Time: <br />
      <input type="time" name="training_time" required />
    </p>
    <p>
      Description: <br />
      <textarea name="training_description" rows="8" cols="80" maxlength="1000"></textarea>
    </p>
    <input type="submit" value="Add new session" />
  </form>
</body>

</html>
